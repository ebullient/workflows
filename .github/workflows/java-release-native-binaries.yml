name: Build and publish native artifacts

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      version:
        required: true
        type: string
      native_java_version:
        required: false
        type: string
        default: '25'

env:
  GH_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
  GH_BOT_NAME: "GitHub Action"
  GRAALVM_DIST: graalvm-community

permissions: {}

jobs:
  native-binaries:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          ref: 'main'

      - name: Build ${{ matrix.os }} native binary
        # zizmor: ignore[unpinned-uses] -- rewritten to a pinned SHA by release-actions.yml at release time
        uses: ebullient/workflows/.github/actions/native-build@e9e9b0e7bde73fab2365f0ab5ad9bb9f647c65e9 # 0.2.3
        with:
          artifact: ${{ inputs.artifact }}
          version: ${{ inputs.version }}
          native-java-version: ${{ inputs.native_java_version }}
          distribution: ${{ env.GRAALVM_DIST }}
          maven-opts: "-Xmx1g"
          maven-args: "-DskipTests -DskipITs"
          matrix-os: ${{ matrix.os }}
